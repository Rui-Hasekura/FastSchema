name: CMake on a single platform

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.clang-format'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.clang-format'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  CMAKE_VERSION: '4.4.2'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-ninja-gcc14

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 ccache

      - name: Cache CMake toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/cmake/*
            ${{ runner.tool_cache }}/ninja/*
          key: get-cmake-${{ runner.os }}-${{ runner.arch }}-${{ env.CMAKE_VERSION }}

      - name: Setup CMake
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: ${{ runner.os }}-gcc14-${{ env.BUILD_TYPE }}
          max-size: 2G
          verbose: 1

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/**/*.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Configure CMake
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -B ${{github.workspace}}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DFETCHCONTENT_BASE_DIR=${{env.FETCHCONTENT_BASE_DIR}}
          -DFASTSCHEMA_BUILD_TESTS=ON
          -DFASTSCHEMA_BUILD_BENCHMARKS=ON

      - name: Build
        run: >
          cmake --build ${{github.workspace}}/build
          --config ${{env.BUILD_TYPE}}
          -j $(nproc)

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -j $(nproc)